name: R CMD check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  R-CMD-check:
    name: R CMD check (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: devel}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript, geographic assets and tooltips
        run: |
          node --check inst/htmlwidgets/lib/bloomr/bloom-core.js
          node tests/browser/test_core_node.js
          node tests/browser/test_tooltips_node.js
          node tests/browser/check-assets.js
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
