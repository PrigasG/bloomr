name: R CMD check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript, geographic assets and tooltips
        run: |
          node --check inst/htmlwidgets/lib/bloomr/bloom-core.js
          node tests/browser/test_core_node.js
          node tests/browser/test_tooltips_node.js
          node tests/browser/check-assets.js
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
